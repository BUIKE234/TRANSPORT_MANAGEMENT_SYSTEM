{% extends "admin/base.html" %}

{% block title %}{{ title }} | Nasiru Abubakar and sons nig LTD{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">Nasiru Abubakar and sons nig LTD</a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --brand-blue: #0d2340;
        --brand-blue-soft: #153c73;
        --brand-orange: #f39c12;
        --brand-orange-soft: #ffb347;
        --white: #ffffff;
        --panel: #f7f9fc;
        --text: #1f2a37;
        --muted: #64748b;
    }

    body {
        background: linear-gradient(135deg, #edf4ff 0%, #dfeaf9 100%);
        color: var(--text);
    }

    #header {
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-blue-soft) 100%);
        border-bottom: 4px solid var(--brand-orange);
    }

    #branding h1, #branding h1 a {
        color: var(--white) !important;
        font-weight: 700;
        letter-spacing: 0.02em;
    }

    .module h2, .module caption, .dashboard .module th {
        background: linear-gradient(90deg, var(--brand-blue) 0%, var(--brand-blue-soft) 100%);
        color: var(--white);
    }

    .button, input[type=submit], input[type=button], .submit-row input {
        background: linear-gradient(180deg, var(--brand-orange) 0%, #e38b00 100%);
        border: none;
        color: var(--white);
        border-radius: 8px;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(243, 156, 18, 0.25);
    }

    .button:hover, input[type=submit]:hover, .submit-row input:hover {
        background: linear-gradient(180deg, var(--brand-orange-soft) 0%, var(--brand-orange) 100%);
    }

    a:link, a:visited {
        color: var(--brand-blue-soft);
    }
</style>
{% endblock %}
