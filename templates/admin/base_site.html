{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | Nasiru Abubakar and sons nig LTD{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --nasiru-black: #0d1117;
        --nasiru-charcoal: #121826;
        --nasiru-blue: #0b1f3a;
        --nasiru-blue-2: #173d6b;
        --nasiru-gold: #d4a64a;
        --nasiru-gold-2: #f3d27d;
        --nasiru-ivory: #f8f6f1;
        --nasiru-white: #ffffff;
        --nasiru-text: #1f2937;
    }

    body {
        background: linear-gradient(140deg, #efefe9 0%, #dfe5ec 40%, #ece6d7 100%);
        color: var(--nasiru-text);
        font-family: "Segoe UI", sans-serif;
    }

    #container {
        padding: 24px 18px 30px;
    }

    #header {
        background: linear-gradient(90deg, #0b1728 0%, #1a2d4d 45%, #0d1d33 100%);
        border-bottom: 4px solid var(--nasiru-gold);
        box-shadow: 0 10px 30px rgba(12, 22, 31, 0.2);
    }

    #branding {
        padding-left: 12px;
    }

    #branding h1, #branding h1 a {
        color: var(--nasiru-white) !important;
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    #branding h1 a {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        flex-wrap: wrap;
    }

    .brand-logo {
        width: 46px;
        height: 46px;
        object-fit: cover;
        border-radius: 12px;
        border: 2px solid rgba(212, 166, 74, 0.9);
        box-shadow: 0 6px 16px rgba(212, 166, 74, 0.35);
        background: #fff;
        flex-shrink: 0;
    }

    #site-name {
        margin: 0;
    }

    .module h2, .module caption, .dashboard .module th,
    .module .collapse-toggle {
        background: linear-gradient(90deg, var(--nasiru-blue) 0%, #214d7e 100%);
        color: var(--nasiru-white) !important;
        border: none;
    }

    .module {
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(11,31,58,0.08);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(15, 26, 42, 0.06);
    }

    .module th, .module td {
        padding: 12px 14px;
    }

    .button, input[type=submit], input[type=button], .submit-row input {
        background: linear-gradient(180deg, var(--nasiru-gold) 0%, #b57b06 100%);
        border: none;
        color: var(--nasiru-black);
        border-radius: 10px;
        font-weight: 700;
        padding: 0.7rem 1.2rem;
        box-shadow: 0 8px 18px rgba(181, 123, 6, 0.28);
        transition: all 0.2s ease-in-out;
    }

    .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover {
        background: linear-gradient(180deg, var(--nasiru-gold-2) 0%, var(--nasiru-gold) 100%);
        transform: translateY(-1px);
    }

    .object-tools a, .paginator a {
        color: var(--nasiru-blue) !important;
        border-radius: 8px;
    }

    .breadcrumbs {
        background: rgba(255,255,255,0.8);
        border: 1px solid rgba(11,31,58,0.08);
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.03);
    }

    a:link, a:visited {
        color: var(--nasiru-blue-2);
    }

    #content-related .module, #changelist-filter {
        box-shadow: 0 12px 28px rgba(17, 29, 45, 0.08);
        border-radius: 14px;
        border: 1px solid rgba(15, 26, 42, 0.08);
    }

    .dashboard #content {
        padding-top: 10px;
    }

    .dashboard .module table {
        width: 100%;
    }

    @media (max-width: 768px) {
        #header {
            min-height: auto;
            padding: 12px 10px;
        }

        #branding h1, #branding h1 a {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        #branding h1 a {
            gap: 8px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
        }
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        <img src="{% static 'images/IMG.jpg' %}" alt="Nasiru Abubakar and sons logo" class="brand-logo" />
        <span>Nasiru Abubakar and sons nig LTD</span>
    </a>
</h1>
{% endblock %}

{% block nav-global %}{% endblock %}
